[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-tracking-studio"
version = "2.0.7"
description = "Local cell segmentation, tracking, and comparison studio"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "ultralytics>=8.3,<9",
  "Pillow>=10,<12",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
test = []

[project.scripts]
celltrack = "celltrack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"celltrack.web" = ["static/**/*"]
