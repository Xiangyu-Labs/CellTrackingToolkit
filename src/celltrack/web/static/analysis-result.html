<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis Result</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v=3">
  <link rel="stylesheet" href="/static/css/components.css?v=2">
  <link rel="stylesheet" href="/static/css/result.css?v=2">
</head>
<body class="result-body">
  <header class="result-header">
    <a class="icon-button" href="/?tab=analysis" id="backLink"><i data-lucide="arrow-left"></i></a>
    <div><strong id="resultId"></strong><small id="resultMeta"></small></div>
    <div class="result-actions" id="resultActions" hidden><a class="button secondary" id="csvLink"><i data-lucide="table-2"></i><span></span></a><a class="button secondary" id="statisticsLink" hidden><i data-lucide="sigma"></i><span></span></a><a class="button primary" id="downloadLink"><i data-lucide="download"></i><span></span></a></div>
  </header>
  <main class="result-main">
    <div id="loading" class="result-loading" role="status" aria-live="polite"><i data-lucide="loader-circle" aria-hidden="true"></i><span></span></div>
    <p id="groupSummary" class="result-summary" hidden></p>
    <pre id="parameterText" class="parameter-text" hidden></pre>
    <div id="imageList" class="result-images"></div>
  </main>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="/static/js/result.js?v=7"></script>
</body>
</html>
