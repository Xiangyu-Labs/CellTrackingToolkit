<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cell Tracking Studio</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v=3">
  <link rel="stylesheet" href="/static/css/components.css?v=5">
  <link rel="stylesheet" href="/static/css/layout.css?v=3">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="brand-mark" aria-hidden="true"></span>
        <strong class="brand-text">Cell Tracking Studio</strong>
        <button class="icon-button" id="sidebarToggle" type="button" aria-label="Collapse sidebar" title="Collapse sidebar"><i data-lucide="panel-left-close"></i></button>
      </div>
      <nav class="stage-nav" aria-label="Workflow">
        <button class="stage-button" type="button" data-tab="segmentation"><span>1</span><strong>Segmentation</strong></button>
        <button class="stage-button" type="button" data-tab="tracking"><span>2</span><strong>Tracking</strong></button>
        <button class="stage-button" type="button" data-tab="compare"><span>3</span><strong>Compare</strong></button>
      </nav>
    </aside>

    <main id="main" class="main-content" tabindex="-1">
      <section id="workflowView">
        <header class="page-header"><h1 id="stageTitle"></h1></header>
        <div class="toolbar">
          <label class="search-field"><i data-lucide="search"></i><span class="sr-only">Search datasets</span><input id="datasetSearch" type="search" placeholder="Search datasets"></label>
          <div id="statusFilters" class="segmented-control" aria-label="Status filters"></div>
        </div>
        <div class="selection-toolbar">
          <span><strong id="selectedCount">0</strong> <span>selected</span></span>
          <button class="text-button" id="selectVisible" type="button">Select visible</button>
          <button class="text-button" id="clearVisible" type="button">Clear visible</button>
        </div>
        <div class="dataset-table">
          <div class="dataset-header"><span></span><span>Dataset</span><span>Images</span><span>Status</span></div>
          <div id="datasetList"></div>
          <div id="datasetEmpty" class="empty-state" hidden>No matching datasets</div>
        </div>
        <div id="jobBar" class="job-bar" hidden></div>
        <div class="action-bar">
          <p id="actionHint"></p>
          <button class="button primary" id="runButton" type="button" disabled><i data-lucide="play"></i><span></span></button>
        </div>
      </section>

      <section id="compareView" hidden>
        <header class="page-header">
          <h1>Compare</h1>
          <button class="button secondary" id="addGroup" type="button"><i data-lucide="plus"></i><span>Add group</span></button>
        </header>
        <div id="groupTabs" class="group-tabs" role="tablist"></div>
        <div class="group-editor">
          <label><span>Group name</span><input id="groupName" maxlength="40"></label>
          <button class="icon-button danger" id="removeGroup" type="button" aria-label="Remove group" title="Remove group"><i data-lucide="trash-2"></i></button>
        </div>
        <div class="toolbar">
          <label class="search-field"><i data-lucide="search"></i><span class="sr-only">Search tracked datasets</span><input id="groupSearch" type="search" placeholder="Search tracked datasets"></label>
          <button class="text-button" id="selectGroupVisible" type="button">Select visible</button>
          <button class="text-button" id="clearGroupVisible" type="button">Clear visible</button>
        </div>
        <div id="groupDatasetList" class="group-dataset-list"></div>

        <details class="parameter-panel" open>
          <summary>Compare parameters</summary>
          <div id="numericParameters" class="parameter-grid"></div>
          <label class="switch-row"><input id="fallbackTracks" type="checkbox"><span>Use all tracks when no long tracks qualify</span></label>
          <fieldset><legend>Figures</legend><div id="figureOptions" class="option-grid"></div></fieldset>
          <fieldset><legend>Temporal metrics</legend><div id="temporalOptions" class="option-grid"></div></fieldset>
          <fieldset><legend>Summary metrics</legend><div id="summaryOptions" class="option-grid"></div></fieldset>
        </details>

        <div class="action-bar compare-action"><p id="compareHint" role="status" aria-live="polite"></p><button class="button primary" id="analyzeButton" type="button" aria-busy="false" disabled><i data-lucide="chart-no-axes-combined"></i><span>Generate comparison</span></button></div>
        <section class="history" aria-labelledby="historyTitle"><h2 id="historyTitle">Analysis history</h2><div id="historyList"></div></section>
      </section>
    </main>
  </div>

  <dialog id="resultDialog" class="result-dialog">
    <header><div><small id="resultKind"></small><h2 id="resultTitle"></h2></div><button class="icon-button" id="closeViewer" aria-label="Close" title="Close"><i data-lucide="x"></i></button></header>
    <div class="viewer-stage"><div id="viewerLoading" class="viewer-loading" role="status"><i data-lucide="loader-circle" aria-hidden="true"></i><span>Generating preview</span></div><img id="resultImage" alt=""></div>
    <footer><button class="icon-button" id="previousFrame" aria-label="Previous frame" title="Previous frame"><i data-lucide="chevron-left"></i></button><input id="frameSlider" type="range" min="1" value="1"><span id="frameCounter"></span><button class="icon-button" id="nextFrame" aria-label="Next frame" title="Next frame"><i data-lucide="chevron-right"></i></button></footer>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="/static/js/app.js?v=10"></script>
</body>
</html>
